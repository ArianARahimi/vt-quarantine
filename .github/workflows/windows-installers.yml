name: Windows installers

# Builds setup.exe and the .msi. Pushing a version tag (v2.0.0) also puts them on
# a draft release, which nobody sees until it's published by hand. Running it by
# hand (Actions > Windows installers > Run workflow) only builds them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # Debian 13 has the wixl (0.106) and NSIS (3.11) the installers are tested with.
    container: debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 wixl nsis
          dpkg-query -W wixl nsis

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' vt-quarantine)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match VERSION = \"$version\" in vt-quarantine"
            exit 1
          fi

      - name: Build the .msi
        run: python3 windows/build.py msi

      # The .msi gets signed here, before setup.exe carries it inside.

      - name: Build setup.exe
        run: python3 windows/build.py setup

      # setup.exe gets signed here.

      - name: Checksums
        working-directory: dist
        run: sha256sum *.msi *.exe | tee SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-installers
          path: |
            dist/*.msi
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-installers
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" \
            --notes "**Windows:** download and run \`vt-quarantine-${TAG#v}-setup.exe\`. The \`.msi\` is for deployment tools and needs Python already installed. **macOS and Linux:** see the [README](https://github.com/$GITHUB_REPOSITORY#install). SHA-256 checksums are in \`SHA256SUMS\`."
