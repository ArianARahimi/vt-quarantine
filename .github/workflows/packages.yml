name: Installers and packages

# Builds the Windows installers (setup.exe, .msi) and the Linux packages (.deb,
# .rpm, Arch), and installs and removes each Linux package on the distributions it
# is for. Runs on every push to master and stable: a commit can only go to stable
# once this has passed on it. Pushing a version tag (v2.0.0) on stable also puts
# them all on a draft release, which nobody sees until it's published by hand.

on:
  push:
    branches: [master, stable]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}

jobs:
  windows:
    runs-on: ubuntu-24.04
    # Debian 13 has the wixl (0.106) and NSIS (3.11) the installers are tested with.
    container: debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 wixl nsis
          dpkg-query -W wixl nsis

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' vt-quarantine)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match VERSION = \"$version\" in vt-quarantine"
            exit 1
          fi

      - name: Build the .msi
        run: python3 windows/build.py msi

      # The .msi gets signed here, before setup.exe carries it inside.

      - name: Build setup.exe
        run: python3 windows/build.py setup

      # setup.exe gets signed here.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - format: deb
            image: debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
            files: dist/*.deb
          - format: rpm
            image: fedora:45@sha256:aacbc26b38361ba0cb3d10f268da40b61b36aed6ed6fe5831a35871636bedb06
            files: dist/*.rpm
          - format: arch
            image: archlinux:base@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413
            files: dist/*.pkg.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the package
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          case $FORMAT in
          deb) linux/build.sh deb ;;
          rpm) dnf install -y rpm-build && linux/build.sh rpm ;;
          arch)
            # makepkg won't run as root.
            pacman -Syu --noconfirm --needed base-devel
            useradd -m builder
            chown -R builder .
            su builder -c "linux/build.sh arch"
            ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-${{ matrix.format }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  linux-test:
    needs: linux
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {format: deb, name: Debian 13, image: "debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4"}
          - {format: deb, name: Ubuntu 24.04, image: "ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"}
          - {format: deb, name: Ubuntu 22.04, image: "ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11"}
          - {format: rpm, name: Fedora 45, image: "fedora:45@sha256:aacbc26b38361ba0cb3d10f268da40b61b36aed6ed6fe5831a35871636bedb06"}
          - {format: arch, name: Arch, image: "archlinux:base@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413"}
    name: Install on ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: linux-${{ matrix.format }}
          path: dist

      - name: Install the package
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          case $FORMAT in
          deb) apt-get update && apt-get install -y ./dist/*.deb ;;
          rpm) dnf install -y ./dist/*.rpm ;;
          arch) pacman -Sy --noconfirm && pacman -U --noconfirm dist/*.pkg.tar.zst ;;
          esac

      - name: Check it
        shell: bash
        run: |
          set -euxo pipefail
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' vt-quarantine)
          test "$(vt-quarantine --version)" = "vt-quarantine $version"
          test -f /usr/lib/systemd/user/vt-quarantine.service
          python3 - <<'EOF'
          import importlib.machinery, importlib.util
          loader = importlib.machinery.SourceFileLoader("vtq", "/usr/bin/vt-quarantine")
          spec = importlib.util.spec_from_loader("vtq", loader)
          vtq = importlib.util.module_from_spec(spec)
          loader.exec_module(vtq)
          assert vtq.packaged(), "not recognised as installed from a package"
          assert vtq.install_requirements(), "jeepney is missing"
          assert not vtq.LIB_ROOT.exists(), "downloaded packages instead of using the distribution's"
          import jeepney
          print("jeepney", jeepney.__version__, "from", jeepney.__file__)
          EOF

      - name: Remove the package
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          case $FORMAT in
          deb) apt-get remove -y vt-quarantine ;;
          rpm) dnf remove -y vt-quarantine ;;
          arch) pacman -R --noconfirm vt-quarantine ;;
          esac
          test ! -e /usr/bin/vt-quarantine
          test ! -e /usr/lib/systemd/user/vt-quarantine.service

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on stable
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/stable ||
            { echo "Releases are made from stable only; $GITHUB_REF_NAME isn't on it."; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Stays a draft: tools/sign-release.sh signs SHA256SUMS on the maintainer's
      # computer (installed copies only update to signed releases), then publishes.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          cp vt-quarantine "dist/vt-quarantine-$v.py"  # what script installs update to
          cd dist
          # Written outside dist first, so the list can't include itself.
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file - <<EOF
          **Windows:** download and run \`vt-quarantine-$v-setup.exe\`. The \`.msi\` is for deployment tools and needs Python already installed.

          **Linux:** install the package for your distribution, then run \`vt-quarantine --install\` as yourself (it asks for your API key):
          - Debian, Ubuntu: \`sudo apt install ./vt-quarantine_$v-1_all.deb\`
          - Fedora: \`sudo dnf install ./vt-quarantine-$v-1.noarch.rpm\`
          - Arch: \`sudo pacman -U vt-quarantine-$v-1-any.pkg.tar.zst\`

          **macOS and other Linux distributions:** see the [README](https://github.com/$GITHUB_REPOSITORY#install).

          SHA-256 checksums are in \`SHA256SUMS\`, signed in \`SHA256SUMS.sig\` (Ed25519; installed copies check it before updating).
          EOF
